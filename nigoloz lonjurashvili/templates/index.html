{% extends 'base.html' %}

{% block title %} MOOOVIE PAGE {% endblock %}

{% block content %}
<h1>This is Movie page</h1>
<div class="row">
    {% for movie in movies %}

    <div class="col">
        <div class="card" style="width: 18rem;">
            <img src="/static/images/{{ movie['img'] }}" class="card-img-top" alt="..." height = 400px>
            <div class="card-body">
                <h5 class="card-title">{{ movie["title"] }}</h5>
                <p class="card-text">{{ movie["rating"] }}</p>
                <a href="/movie/{{ movie['id'] }}" class="btn btn-primary">paich chadudgni?</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
